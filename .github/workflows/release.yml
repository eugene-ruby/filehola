name: Docker Hub release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch current main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Refresh release tag
        run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: Validate release tag and ancestry
        id: release
        run: python3 scripts/release_image.py validate
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofmt
        run: test -z "$(gofmt -l cmd internal integration tools)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Validate OpenAPI and HTTP routes
        run: make check-api
      - name: Release policy tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: PostgreSQL and MinIO integration tests with race detector
        run: make integration
      - name: Stop test dependencies
        if: always()
        run: docker compose down

  publish:
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: filehola-dockerhub-release
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch current main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Refresh release tag
        run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: Recheck release ancestry and tag identity
        run: python3 scripts/release_image.py validate
        env:
          EXPECTED_RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
      - name: Require Docker Hub credentials
        run: python3 scripts/release_image.py credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Check immutable image tag
        id: image
        run: python3 scripts/release_image.py preflight
        env:
          IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/filehola
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/filehola
          flavor: latest=false
          tags: type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Filehola
            org.opencontainers.image.description=File service with drafts, revisions, and publishing
            org.opencontainers.image.source=https://github.com/eugene-ruby/filehola
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.commit }}
            org.opencontainers.image.licenses=MIT
      - name: Verify generated image tag
        run: |
          test "$META_VERSION" = "$RELEASE_VERSION"
          test "$META_TAGS" = "$IMAGE_NAME:$RELEASE_VERSION"
        env:
          META_VERSION: ${{ steps.meta.outputs.version }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/filehola
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      - name: Build and publish immutable multi-platform image
        if: steps.image.outputs.publish == 'true'
        uses: docker/build-push-action@v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            index:org.opencontainers.image.revision=${{ needs.verify.outputs.commit }}
          sbom: true
          provenance: mode=min
      - name: Advance minor and latest without rollback
        run: python3 scripts/release_image.py promote
        env:
          IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/filehola
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
